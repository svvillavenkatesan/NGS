<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#300057">
  <title>Golden Jackpot · Live Results</title>
  <link rel="stylesheet" href="/public-results/styles.css">
</head>
<body>
  <main class="stage">
    <header class="hero">
      <div class="crown" aria-hidden="true">♛</div>
      <div>
        <p class="eyebrow">OFFICIAL LIVE RESULT</p>
        <h1>GOLDEN <span>JACKPOT</span></h1>
      </div>
      <div class="live"><i></i> LIVE</div>
    </header>

    <section class="result-controls">
      <label class="date-control"><span>SELECT RESULT DATE</span><input id="result-date-picker" type="date"></label>
      <div class="display-date"><span>RESULT DATE</span><strong id="large-result-date">--/--/----</strong></div>
      <div class="history-control">
        <label><span>PDF HISTORY</span><select id="history-days"><option value="30">1 MONTH</option><option value="60">2 MONTHS</option><option value="90">3 MONTHS</option></select></label>
        <button id="download-pdf" type="button">PDF / PRINT</button>
      </div>
    </section>

    <section class="result-grid" id="result-grid" aria-live="polite"></section>

    <footer>
      <div><span>RESULT DATE</span><strong id="result-date">--/--/----</strong></div>
      <p>Results update automatically after publishing</p>
      <div class="right"><span>LAST UPDATED</span><strong id="updated-time">--:--:--</strong></div>
    </footer>
  </main>
  <script type="module" src="/public-results/app.js"></script>
</body>
</html>
