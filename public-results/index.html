<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#300057">
  <title>Golden Chance · Live Results</title>
  <link rel="stylesheet" href="/public-results/styles.css">
</head>
<body>
  <main class="stage">
    <header class="hero">
      <div class="crown" aria-hidden="true">♛</div>
      <div>
        <p class="eyebrow">OFFICIAL LIVE RESULT</p>
        <h1>GOLDEN <span>CHANCE</span></h1>
      </div>
      <div class="live"><i></i> LIVE</div>
    </header>

    <section class="result-grid" id="result-grid" aria-live="polite"></section>

    <footer>
      <div><span>RESULT DATE</span><strong id="result-date">--/--/----</strong></div>
      <p>Results update automatically after publishing</p>
      <div class="right"><span>LAST UPDATED</span><strong id="updated-time">--:--:--</strong></div>
    </footer>
  </main>
  <script type="module" src="/public-results/app.js"></script>
</body>
</html>
