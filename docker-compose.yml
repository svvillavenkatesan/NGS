services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-number_game}
      POSTGRES_USER: ${POSTGRES_USER:-number_game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports: ["5432:5432"]
    volumes:
      - number_game_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-number_game} -d ${POSTGRES_DB:-number_game}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-number_game}:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/${POSTGRES_DB:-number_game}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
    ports: ["4000:4000"]
    volumes: [".:/app"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  number_game_data:
