services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-number_game}
      POSTGRES_USER: ${POSTGRES_USER:-number_game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - number_game_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-number_game} -d ${POSTGRES_DB:-number_game}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-number_game}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-number_game}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OWNER_INITIAL_PASSWORD: ${OWNER_INITIAL_PASSWORD:?Set OWNER_INITIAL_PASSWORD in .env}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes:
  number_game_data:
  caddy_data:
  caddy_config:
